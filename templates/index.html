<!DOCTYPE html>
<html>
<head>
    <title>Language Translation Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 95%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
        }

        .languages {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 20px 0;
        }

        .language-box {
            width: 50%;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .translate-btn {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .translate-btn:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: left;
        }

        .result h2 {
            margin-top: 0;
        }

        .result p {
            font-size: 17px;
            word-wrap: break-word;
        }

        .copy-btn {
            padding: 10px 15px;
            background: #555;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Language Translation Tool</h1>

        <p class="subtitle">
            Translate text easily between different languages
        </p>

        <form method="POST">

            <label>Enter Text</label>

            <textarea
                name="text"
                placeholder="Type your text here..."
                required></textarea>

            <div class="languages">

                <div class="language-box">

                    <label>Source Language</label>

                    <select name="source">

                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="kn">Kannada</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>

                    </select>

                </div>

                <div class="language-box">

                    <label>Target Language</label>

                    <select name="target">

                        <option value="hi">Hindi</option>
                        <option value="en">English</option>
                        <option value="kn">Kannada</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>

                    </select>

                </div>

            </div>

            <button class="translate-btn" type="submit">
                Translate
            </button>

        </form>


        {% if translated_text %}

        <div class="result">

            <h2>Translated Text</h2>

            <p id="translation">{{ translated_text }}</p>

            <button
                class="copy-btn"
                type="button"
                onclick="copyTranslation()">

                Copy Translation

            </button>

        </div>

        {% endif %}

    </div>


    <script>

        function copyTranslation() {

            const text =
                document.getElementById("translation").innerText;

            navigator.clipboard.writeText(text);

            alert("Translation copied!");

        }

    </script>

</body>
</html>
